name: Build Windows EXE

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PTA-Monitor pta_monitor.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-Monitor-windows-exe
          path: dist/PTA-Monitor.exe

      - name: Publish rolling release asset
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Automated Windows build from latest push.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/PTA-Monitor.exe
          makeLatest: true
